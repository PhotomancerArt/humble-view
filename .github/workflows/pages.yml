name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The dashboard at /, from the browser composition root; Storybook at /storybook/.
      - run: VITE_BASE=/humble-ui-stack/ pnpm --filter @humble/dashboard build
      - run: pnpm --filter @humble/storybook build
      - run: |
          mkdir -p site/storybook
          cp -r apps/dashboard/dist/. site/
          mv site/index.browser.html site/index.html
          cp -r apps/storybook/storybook-static/. site/storybook/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
